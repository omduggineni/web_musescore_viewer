name: Build wasm viewer

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Build mode: devel, nightly, testing, stable'
        default: 'devel'
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: MuseScore
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Apply URL-autoload overlay to viewer.html
        run: cp "$GITHUB_WORKSPACE/overlay/viewer.html" src/web/appjs/viewer/viewer.html

      - name: Configure workflow
        run: |
          bash ./buildscripts/ci/tools/make_build_mode_env.sh -e workflow_dispatch -m ${{ inputs.build_mode }}
          BUILD_MODE=$(cat ./build.artifacts/env/build_mode.env)
          bash ./buildscripts/ci/tools/make_build_number.sh
          BUILD_NUMBER=$(cat ./build.artifacts/env/build_number.env)
          echo "BUILD_MODE=$BUILD_MODE" | tee -a $GITHUB_ENV
          echo "BUILD_NUMBER=$BUILD_NUMBER" | tee -a $GITHUB_ENV

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.2'
          host: all_os
          target: 'wasm'
          arch: wasm_singlethread
          modules: 'qt5compat qtscxml qtshadertools'
          cache: true

      - name: Setup environment
        run: bash ./buildscripts/ci/linux/setup.sh --arch wasm

      - name: Build MuseScoreStudio + MuseAudio
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}
        run: bash ./buildscripts/ci/wasm/build.sh -n ${{ env.BUILD_NUMBER }}

      - name: Package
        run: bash ./buildscripts/ci/wasm/package.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm-site
          path: MuseScore/build.artifacts/
          retention-days: 30
