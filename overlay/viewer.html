<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!--Set visual viewport size for mobile devices to the device size,
        witch results in a scale of 1 and a 1:1 mapping between CSS pixels
        and Qt device independent pixels. -->
    <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0"/>

    <title>MuseScoreStudio</title>
    <style>
      html, body { padding: 0; margin: 0; overflow: hidden; height: 100% }
      #spinner {
        display: flex;
        justify-content: center; /* горизонтальное выравнивание */
        align-items: center;     /* вертикальное выравнивание */
        height: 100vh;           /* на всю высоту viewport */
      }
      #panel { 
        width: 100%; 
        height: 40px; 
        background-color: #f0f0f0; 
        display: flex; 
        align-items: center;
        padding: 2px 5px;
        box-sizing: border-box;
      }
      #panel button {
        margin-right: 5px;
        height: 16px;
        font-size: 10px;
        line-height: 10px;
        padding: 0 4px;
        cursor: pointer;
      }
      #screen { width: 100%; height: calc(100% - 40px); }
      #panel button, #panel input {
        margin-right: 5px;
        height: 22px;
        font-size: 11px;
        cursor: pointer;
      }
      #loadError {
        display: none;
        position: fixed;
        top: 44px;
        left: 8px;
        right: 8px;
        z-index: 1000;
        background: #fde8e8;
        border: 1px solid #d33;
        color: #822;
        padding: 8px 12px;
        font: 12px sans-serif;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>

    <figure id="spinner">
      <center style="margin-top:1.5em; line-height:150%">
        <strong>MuseScoreStudio</strong>
        <div id="status"></div>
        <noscript>JavaScript is disabled. Please enable JavaScript to use this application.</noscript>
      </center>
    </figure>

    <div id="loadError"></div>

    <div id="panel">
      <button id="openBtn">Open file&hellip;</button>
      <input id="load_file" type="file" accept=".mscz" style="display:none">
      <button id="downloadBtn" disabled>Download .mscz</button>
    </div>
    <div id="screen"></div>

    <script type="module">
      import createMuApi from "./distr/muapi.js";

      const spinner = document.querySelector('#spinner');
      const screen = document.querySelector('#screen');
      const status = document.querySelector('#status');
      const loadError = document.querySelector('#loadError');
      const openBtn = document.querySelector('#openBtn');
      const loadFileInput = document.querySelector('#load_file');
      const downloadBtn = document.querySelector('#downloadBtn');

      const showUi = (ui) => {
          [spinner, screen].forEach(element => element.style.display = 'none');
          if (screen === ui)
              screen.style.position = 'default';
          ui.style.display = 'block';
      }

      const showError = (msg) => {
          loadError.textContent = msg;
          loadError.style.display = 'block';
      }

      // The most recently saved score, kept so the Download button always
      // reflects the current state of the score open in the editor.
      let lastSavedBytes = null;
      let lastFileBaseName = 'score';

      function triggerDownload(bytes, filename) {
          const blob = new Blob([bytes], { type: 'application/octet-stream' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
      }

      // Resolve a display/download base name from the ?url= query param, if present.
      function baseNameFromUrl(rawUrl) {
          try {
              const u = new URL(rawUrl, window.location.href);
              const last = decodeURIComponent(u.pathname.split('/').pop() || '');
              const name = last.replace(/\.mscz$/i, '');
              return name || 'score';
          } catch (e) {
              return 'score';
          }
      }

      try {

        showUi(spinner);
        status.innerHTML = 'Loading...';

        window.muapi = await createMuApi({

          // properties
          screen: screen,

          // runtime
          onLoaded: () => showUi(screen),
          onExit: function(exitData) {
            status.innerHTML = 'Application exit';
            status.innerHTML += exitData.code !== undefined ? ` with code ${exitData.code}` : '';
            status.innerHTML += exitData.text !== undefined ? ` (${exitData.text})` : '';
            showUi(spinner);
          },

          // api callbacks
          onProjectSaved: function(data) {
            console.log("[html] onProjectSaved len: ", data.length)
            lastSavedBytes = data;
            downloadBtn.disabled = false;
          }
        })

        document.addEventListener('click', window.muapi.startAudioProcessing, { once: true });

        openBtn.addEventListener('click', () => loadFileInput.click());
        loadFileInput.addEventListener('change', () => {
            const file = loadFileInput.files[0];
            if (!file) return;
            lastFileBaseName = file.name.replace(/\.mscz$/i, '');
            window.muapi.loadScoreFile(file);
        });

        downloadBtn.addEventListener('click', () => {
            if (lastSavedBytes) {
                triggerDownload(lastSavedBytes, lastFileBaseName + '.mscz');
            }
        });

        // Auto-load a score passed as a query param, e.g. ?url=https://example.com/piece.mscz
        // The remote host must send permissive CORS headers (Access-Control-Allow-Origin) for
        // this fetch to succeed, since there is no server-side proxy in a static deployment.
        const scoreUrl = new URLSearchParams(window.location.search).get('url');
        if (scoreUrl) {
            lastFileBaseName = baseNameFromUrl(scoreUrl);
            status.innerHTML = 'Fetching score...';
            try {
                const response = await fetch(scoreUrl, { mode: 'cors' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status} fetching score`);
                }
                const bytes = new Uint8Array(await response.arrayBuffer());
                window.muapi.loadScoreData(bytes);
            } catch (e) {
                console.error(e);
                showError(
                    'Could not load score from URL: ' + e.message +
                    '. Check that the host allows cross-origin requests (CORS).'
                );
            }
        }
    } catch (e) {
        console.error(e);
        console.error(e.stack);
        showError('Failed to start MuseScore Studio: ' + e.message);
    }
    </script>
    <script src="MuseScoreStudio.js"></script>
  </body>
</html>
