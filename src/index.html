<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Score Viewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div id="scoreInfo">
      <span id="scoreTitle"></span>
      <span id="scoreComposer"></span>
    </div>
    <!-- Below 700px there isn't room for title + composer + all these
         controls on one line, so the composer is dropped (see style.css)
         and the controls collapse behind this menu button instead - opens
         #rightControls as a real second row of the bar, not an overlay.
         Above that width the button is hidden and #rightControls is
         forced always-visible, unstyled, inline (today's desktop look). -->
    <button id="menuBtn" type="button" class="icon-btn" title="More controls" aria-haspopup="true" aria-expanded="false">
      <!-- Lucide "menu" icon - https://lucide.dev/icons/menu (ISC license) -->
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5h16" />
        <path d="M4 12h16" />
        <path d="M4 19h16" />
      </svg>
    </button>
    <div id="rightControls" hidden>
      <div id="tempoGroup" class="dropdown">
        <!-- Tempo readout doubles as the control: click it to reveal a
             slider (below) that adjusts playback speed - the label always
             shows the resulting tempo, never a raw "x" multiplier. -->
        <button id="tempoBtn" type="button" class="tempo-btn" title="Click to change tempo" aria-haspopup="true" aria-expanded="false">
          <span id="tempoLabel"></span>
        </button>
        <div id="tempoPanel" class="dropdown-panel" hidden>
          <input id="speedSlider" type="range" min="0.7" max="1" step="0.02" value="1" title="Tempo" aria-label="Tempo">
          <span id="speedValue">1.00×</span>
        </div>
      </div>
      <button id="metronomeBtn" type="button" class="icon-btn" title="Metronome" aria-pressed="false">
        <!-- Lucide "metronome" icon - https://lucide.dev/icons/metronome (ISC license) -->
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 11.4V9.1" />
          <path d="m12 17 6.59-6.59" />
          <path d="m15.05 5.7-.218-.691a3 3 0 0 0-5.663 0L4.418 19.695A1 1 0 0 0 5.37 21h13.253a1 1 0 0 0 .951-1.31L18.45 16.2" />
          <circle cx="20" cy="9" r="2" />
        </svg>
      </button>
      <div id="viewToggle" class="segmented" role="group" aria-label="Page layout">
        <button id="viewCenteredBtn" type="button" class="segment" title="Centered view" aria-pressed="true">
          <!-- Lucide "file" icon - https://lucide.dev/icons/file (ISC license) -->
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
            <path d="M14 2v5a1 1 0 0 0 1 1h5" />
          </svg>
        </button>
        <button id="viewBookBtn" type="button" class="segment" title="Book view" aria-pressed="false">
          <!-- Lucide "book-open" icon - https://lucide.dev/icons/book-open (ISC license) -->
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v16" />
            <path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z" />
          </svg>
        </button>
      </div>
      <div id="zoomGroup" class="segmented">
        <button id="zoomOutBtn" type="button" class="segment" title="Zoom out">
          <!-- Lucide "zoom-out" icon - https://lucide.dev/icons/zoom-out (ISC license) -->
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" x2="16.65" y1="21" y2="16.65" />
            <line x1="8" x2="14" y1="11" y2="11" />
          </svg>
        </button>
        <button id="zoomInBtn" type="button" class="segment" title="Zoom in">
          <!-- Lucide "zoom-in" icon - https://lucide.dev/icons/zoom-in (ISC license) -->
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" x2="16.65" y1="21" y2="16.65" />
            <line x1="11" x2="11" y1="8" y2="14" />
            <line x1="8" x2="14" y1="11" y2="11" />
          </svg>
        </button>
      </div>
      <button id="fullscreenBtn" type="button" class="icon-btn" title="Fullscreen" aria-pressed="false">
        <!-- Lucide "maximize" icon - https://lucide.dev/icons/maximize (ISC license); swapped
             for "minimize" (https://lucide.dev/icons/minimize, also ISC) when active - app.js -->
        <svg id="fullscreenIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3" />
          <path d="M21 8V5a2 2 0 0 0-2-2h-3" />
          <path d="M3 16v3a2 2 0 0 0 2 2h3" />
          <path d="M16 21h3a2 2 0 0 0 2-2v-3" />
        </svg>
      </button>
      <button id="mixerToggleBtn" type="button" class="icon-btn" title="Toggle mixer" aria-pressed="true">
        <!-- Lucide "sliders-horizontal" icon - https://lucide.dev/icons/sliders-horizontal (ISC license) -->
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 5H3" />
          <path d="M12 19H3" />
          <path d="M14 3v4" />
          <path d="M16 17v4" />
          <path d="M21 12h-9" />
          <path d="M21 19h-5" />
          <path d="M21 5h-7" />
          <path d="M8 10v4" />
          <path d="M8 12H3" />
        </svg>
      </button>
    </div>
  </header>

  <main id="main">
    <section id="pagesWrap">
      <div id="pages"></div>
    </section>

    <aside id="mixer">
      <h2>Mixer</h2>
      <div id="channels"></div>
    </aside>
  </main>

  <footer id="transport">
    <button id="playBtn" class="icon-btn" title="Play" aria-pressed="false" disabled>
      <!-- Lucide "play" icon - https://lucide.dev/icons/play (ISC license); swapped for
           "pause" (https://lucide.dev/icons/pause, also ISC) while playing - app.js -->
      <svg id="playIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z" />
      </svg>
    </button>
    <input id="seek" type="range" min="0" max="1000" value="0" step="1" disabled>
    <span id="timeLabel">0:00 / 0:00</span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
